version: "3.9"

services:
  mm-postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mattermost
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: ${MM_DB_PASSWORD}
    volumes:
      - mm-postgres-data:/var/lib/postgresql/data
    networks:
      - mattermost-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No host port exposed — avoids conflict with existing 5432 on the host

  mattermost:
    image: mattermost/mattermost-team-edition:latest
    restart: unless-stopped
    depends_on:
      mm-postgres:
        condition: service_healthy
    expose:
      - "8065"
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: "postgres://mmuser:${MM_DB_PASSWORD}@mm-postgres:5432/mattermost?sslmode=disable&connect_timeout=10"
      MM_SERVICESETTINGS_SITEURL: "https://${DOMAIN}"
      MM_SERVICESETTINGS_LISTENADDRESS: ":8065"
      MM_SERVICESETTINGS_FORWARD80TO443: "false"
      MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS: "false"
      # Push proxy (internal — gracefully fails if internet/FCM is unavailable)
      MM_EMAILSETTINGS_PUSHNOTIFICATIONSERVER: "http://push-proxy:8066"
      # Performance tuning for ~7 GB RAM / 2 Xeon cores
      MM_SQLSETTINGS_MAXOPENCONNS: "20"
      MM_SQLSETTINGS_MAXIDLECONNS: "10"
      MM_FILESETTINGS_MAXFILESIZE: "104857600"
      MM_LOGSETTINGS_ENABLECONSOLE: "true"
      MM_LOGSETTINGS_CONSOLELEVEL: "INFO"
    volumes:
      - mattermost-config:/mattermost/config
      - mattermost-data:/mattermost/data
      - mattermost-logs:/mattermost/logs
      - mattermost-plugins:/mattermost/plugins
    networks:
      - mattermost-net

  push-proxy:
    image: mattermost/mattermost-push-proxy:latest
    restart: unless-stopped
    environment:
      # Gracefully handles a missing or placeholder FCM key
      MATTERMOST_PUSH_PROXY_ANDROID_API_KEY: "${FCM_API_KEY:-placeholder}"
    expose:
      - "8066"
    networks:
      - mattermost-net

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - mattermost
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx-logs:/var/log/nginx
    networks:
      - mattermost-net

networks:
  mattermost-net:
    driver: bridge

volumes:
  mm-postgres-data:
  mattermost-config:
  mattermost-data:
  mattermost-logs:
  mattermost-plugins:
  nginx-logs:
